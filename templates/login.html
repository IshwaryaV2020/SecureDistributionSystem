<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retail Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='retail_style.css') }}">
</head>
<body>
<div class="login_box">
    <h1>Product Distribution System</h1>
    <h2>User Login</h2>
{% if error %}
    <p class="error_msg">{{ error }}</p>
{% endif %}
    <form method="POST" action="/login">

        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="user_pwd" required>

        <br><br>

        <button type="submit">Login</button>

    </form>
</div>
</body>
</html>
