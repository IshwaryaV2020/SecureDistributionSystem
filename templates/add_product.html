<!DOCTYPE html>
<html>
<head>
    <title>Add Retail Product</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='retail_style.css') }}">
</head>

<body>

    <h1>Add the product details</h1>

    <a href="{{ url_for('products') }}">Back to Product Inventory</a>

    {% if error %}
        <p class="error_msg">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('product_add') }}">

        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Product Name</label>
        <input type="text" name="p_name" maxlength="100" required>

        <label>Product Category</label>
        <select name="p_category" required>
            {% for category in retail_categories %}
                <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
        </select>

        <label>Product Price (€)</label>
        <input type="number" name="p_price"
               min="0" step="0.01" required>

        <label>Product Quantity</label>
        <input type="number" name="p_quantity"
               min="0" step="1" required>

        <label>Product Description</label>
        <textarea name="p_desc" maxlength="500"></textarea>

        <label>Product SKU</label>
        <input type="text" name="p_sku" maxlength="30" required>

        <button type="submit">Add Product</button>

    </form>

</body>
</html>
